name: CI/CD & Auto-Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buyerly-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moved to 26.04 on 2026-10-24,
# where Playwright has no Chromium build and pg_dump is 17 against our PostgreSQL 16.
jobs:
  frontend:
    name: Build React Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm run build` runs tsc first, so a type error fails here rather than
      # reaching production. No test reads frontend/dist, so this runs beside
      # the test shards instead of inside each one.
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  # The browser checks used to run one after another inside the frontend job
  # (~7.5 minutes, and the test shards waited for all of them). Each group is
  # now its own runner, started at once beside the build and the test shards;
  # the groups are balanced by how long their scripts took on 2026-10-10.
  # Each script still serves the app itself through Vite on 127.0.0.1:5174,
  # so none of them needs the built frontend.
  browser:
    name: Browser checks (${{ matrix.group }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: small screens and Inbox
            scripts: mobile-screens inbox rerender
          - group: sidebar, command menu, rules
            scripts: mobile-sidebar command-menu rule-states rules-phone rule-labels rule-window rules-view favorites account-bell
          - group: workspace state, new version, WebMCP
            scripts: scoped-state new-version service-worker webmcp view-options accounts navigation page-switch
          - group: members, search, settings
            scripts: members workspace-lists search-page workspace-switcher security profile sync local-database transactions shared-sync
          - group: auth, details pane, Ads Manager rules
            scripts: details-pane invite-auth onboarding-invites auth-theme workspace-settings multi-account rules-attach ads-manager toolbar-buttons

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Playwright is a pinned devDependency in package-lock.json, so
      # `npm ci` installs it. Installing it ad hoc without the lock file
      # re-resolved the whole tree and once hit a package version npm listed
      # but did not serve yet (#245).
      - name: Install Chromium
        working-directory: frontend
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      # Fills the React Compiler's cache once (#492); each script then starts
      # its own dev server without compiling every file again, which pushed a
      # cold first page past the scripts' 10 s timeout.
      - name: Warm the React Compiler cache
        working-directory: frontend
        run: npx vite build --outDir /tmp/buyerly-warm-build

      # StyleX compiles a file differently in dev, so the build above leaves
      # the StyleX files uncached for the dev server; loading the app once
      # through it fills them, so no first page outruns a 10 s timeout.
      - name: Warm the dev server
        working-directory: frontend
        run: node ../scripts/warm-dev-server.ts

      # Every script in the group runs even after one fails, so a single run
      # reports all broken screens. The runner's Google Chrome has WebMCP
      # behind a flag; Playwright's Chromium does not, and webmcp-browser.ts
      # then uses a stand-in instead.
      - name: Check in Chromium
        working-directory: frontend
        run: |
          status=0
          for name in ${{ matrix.scripts }}; do
            echo "::group::${name}-browser.ts"
            if [ "${name}" = webmcp ]; then
              export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || true)"
            else
              unset PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
            fi
            if ! node "../scripts/${name}-browser.ts"; then
              echo "::error title=Browser check failed::scripts/${name}-browser.ts"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      # Screenshots land in /tmp/buyerly-<script name>.
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ strategy.job-index }}
          path: /tmp/buyerly-*
          if-no-files-found: ignore

  # The server: types, lint, tests, then the production image itself.
  # Nothing else builds the Dockerfile before deploy.
  server:
    name: TypeScript server and image
    runs-on: ubuntu-24.04

    # The entities' check (server/test/schema.test.ts) compares them with the
    # schema the migrations build, so the job migrates a Postgres of its own.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buyerly
          POSTGRES_PASSWORD: buyerly_secret
          POSTGRES_DB: buyerly_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The TypeScript worker's BullMQ queues (#611 stage 4).
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Migrate the schema with TypeORM
        run: |
          npm ci
          npm run build --workspace @buyerly/server
          DATABASE_URL=postgresql://buyerly:buyerly_secret@localhost:5432/buyerly_schema node server/dist/migrate.js
          # The rule simulator's test drops and rebuilds this one.
          PGPASSWORD=buyerly_secret psql -h localhost -U buyerly -d buyerly_schema -c 'CREATE DATABASE buyerly_test'

      - name: Typecheck, lint and test
        env:
          SCHEMA_DATABASE_URL: postgresql://buyerly:buyerly_secret@localhost:5432/buyerly_schema
          # The rule simulator's test drops and rebuilds this disposable database.
          TEST_DATABASE_URL: postgresql+asyncpg://buyerly:buyerly_secret@localhost:5432/buyerly_test
          TEST_DATABASE_DISPOSABLE: buyerly_test
          REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          npm run typecheck
          npm run lint
          npm test --workspace @buyerly/server

      - name: Build the production image
        run: docker build --build-arg APP_VERSION=ci -t buyerly-app:ci .

      # Compose passes APP_VERSION in production, as here. Without a database
      # the server is alive but not ready; both answers
      # prove Node, its dependencies and the compiled code work in the image.
      - name: Run the server from the image
        run: |
          docker run -d --name buyerly-server-ci -e APP_VERSION=ci -e SERVER_PORT=8080 -p 127.0.0.1:8090:8080 buyerly-app:ci node server/dist/main.js
          for attempt in $(seq 30); do
            if curl -fsS http://127.0.0.1:8090/health/live; then break; fi
            sleep 1
          done
          echo
          test "$(curl -fsS http://127.0.0.1:8090/health/live)" = '{"status":"alive","version":"ci"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/health/ready)" = 503
          # The site: the public pages the image renders (#700), the React app,
          # the service worker.
          curl -fsS http://127.0.0.1:8090/ | grep -q '<h1 id="hero-title"'
          curl -fsS http://127.0.0.1:8090/privacy | grep -q '<h1>Privacy</h1>'
          curl -fsS http://127.0.0.1:8090/changelog | grep -q '<h1 class="[^"]*">Changelog</h1>'
          release=$(ls changelog | sort | tail -n 1)
          curl -fsS "http://127.0.0.1:8090/changelog/${release%.md}" | grep -q 'href="/changelog"'
          stylesheet=$(curl -fsS http://127.0.0.1:8090/about | grep -o '/assets/public-website-[^"]*\.css')
          curl -fsS "http://127.0.0.1:8090${stylesheet}" | grep -q 'font-face'
          curl -fsS http://127.0.0.1:8090/login | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/sw.js)" = 200
          docker logs buyerly-server-ci
          docker rm -f buyerly-server-ci

      # The worker as Compose runs it, on this job's Postgres and Redis: it
      # schedules its jobs, runs them, reports them on its health route, and
      # stops cleanly on SIGTERM (exit code 0).
      - name: Run the worker from the image
        run: |
          trap 'docker logs buyerly-worker-ci 2>&1 | tail -50 || true' ERR
          # The worker runs every job, monitoring included: a database of its
          # own, migrated by the image, rather than the tests' leftover data.
          PGPASSWORD=buyerly_secret psql -h 127.0.0.1 -U buyerly -d buyerly_schema -c 'CREATE DATABASE buyerly_worker_ci'
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://buyerly:buyerly_secret@127.0.0.1:5432/buyerly_worker_ci \
            buyerly-app:ci node server/dist/migrate.js
          docker run -d --name buyerly-worker-ci --network host -e APP_VERSION=ci \
            -e DATABASE_URL=postgresql://buyerly:buyerly_secret@127.0.0.1:5432/buyerly_worker_ci \
            -e REDIS_URL=redis://127.0.0.1:6379/2 \
            buyerly-app:ci node server/dist/worker/main.js
          health=""
          for attempt in $(seq 30); do
            health=$(curl -fsS http://127.0.0.1:8091/health/worker-ts || true)
            if echo "${health}" | grep -q '"sync_log_compaction":{[^}]*"outcome":"ok"'; then break; fi
            sleep 1
          done
          echo "${health}"
          echo "${health}" | grep -q '"status":"ok"'
          echo "${health}" | grep -q '"sync_log_compaction":{[^}]*"outcome":"ok"'
          docker stop --timeout 30 buyerly-worker-ci
          docker logs buyerly-worker-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' buyerly-worker-ci)" = 0
          docker rm buyerly-worker-ci

  # One check to require in branch protection. Requiring the shards directly
  # would mean editing the protection rule every time their number changes.
  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [frontend, browser, server]
    if: always()

    steps:
      - name: Verify every job succeeded
        run: |
          frontend='${{ needs.frontend.result }}'
          browser='${{ needs.browser.result }}'
          server='${{ needs.server.result }}'
          echo "frontend=${frontend} browser=${browser} server=${server}"
          if [ "${frontend}" != "success" ] || [ "${browser}" != "success" ] || [ "${server}" != "success" ]; then
            echo "::error title=CI failed::frontend=${frontend} browser=${browser} server=${server}"
            exit 1
          fi

  deploy:
    name: Deploy to Production VPS
    needs: [frontend, browser, server]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production

    steps:
      - name: Execute Remote SSH Commands for Deployment
        id: production_ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || '' }}
          password: ${{ secrets.VPS_PASSWORD || '' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          capture_stdout: true
          script: |
            set -e
            echo "🚀 [Deploy] Connected to VPS. Starting deployment for Buyerly..."
            if [ -d "/opt/buyerly" ]; then
              cd /opt/buyerly
              echo "📥 Pulling latest git changes..."
              git fetch origin main
              git reset --hard origin/main
              chmod +x scripts/*.sh || true
              deploy_log="/tmp/buyerly-deploy-${{ github.sha }}.log"
              umask 077
              : >"${deploy_log}"
              if EXPECTED_SHA="${{ github.sha }}" RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}" bash scripts/deploy.sh >"${deploy_log}" 2>&1; then
                echo "BUYERLY_DEPLOY_RESULT=success"
                grep -E '^\[INFO\] TypeScript smoke' "${deploy_log}" | tail -n 3 || true
                rm -f "${deploy_log}"
              else
                deploy_status=$?
                echo "BUYERLY_DEPLOY_RESULT=failure"
                echo "BUYERLY_DEPLOY_EXIT=${deploy_status}"
                grep -E '^(\[[0-9]+/[0-9]+\]|\[(ERROR|ROLLBACK|WARNING)\]|ERROR:|DETAIL:)' "${deploy_log}" \
                  | tail -n 20 \
                  | sed -E 's/(re_)[A-Za-z0-9_]{6,}/\1[REDACTED]/g' \
                  || true
                grep -E '(MetaTokenError|Migration failed|QueryFailedError|Error:|FAILED:)' "${deploy_log}" \
                  | grep -Ev '(parameters:|UPDATE accounts|INSERT INTO)' \
                  | tail -n 12 \
                  | sed -E \
                    -e 's/gAAAAA[A-Za-z0-9_-]+/[REDACTED_FERNET_TOKEN]/g' \
                    -e 's/EAA[A-Za-z0-9_-]{10,}/[REDACTED_META_TOKEN]/g' \
                    -e 's#(://)[^:/[:space:]]+:[^@/[:space:]]+@#\1[REDACTED]@#g' \
                    -e 's/(password=)[^&[:space:]]+/\1[REDACTED]/Ig' \
                  || true
                grep -E '(Applied migrations:|No pending migrations)' "${deploy_log}" \
                  | grep -Ev '(parameters:|UPDATE accounts|INSERT INTO)' \
                  | tail -n 24 \
                  || true
              fi
            else
              echo "❌ Error: /opt/buyerly directory does not exist on server!"
              echo "BUYERLY_DEPLOY_RESULT=failure"
              echo "[ERROR] Production application directory is missing."
            fi
            exit 0

      - name: Assert Remote Deployment Result
        env:
          DEPLOY_OUTPUT: ${{ steps.production_ssh.outputs.stdout }}
        run: |
          if printf '%s\n' "${DEPLOY_OUTPUT}" | grep -q '^BUYERLY_DEPLOY_RESULT=success$'; then
            exit 0
          fi
          diagnostic=$(printf '%s\n' "${DEPLOY_OUTPUT}" \
            | grep -E '(^(BUYERLY_DEPLOY_EXIT=|\[[0-9]+/[0-9]+\]|\[(ERROR|ROLLBACK|WARNING)\]|ERROR:|DETAIL:)|Applied migrations:|No pending migrations|MetaTokenError|Migration failed|QueryFailedError|Error:|FAILED:)' \
            | tail -n 56 \
            | tr '\n' ' ')
          diagnostic=${diagnostic//%/%25}
          diagnostic=${diagnostic//$'\r'/%0D}
          diagnostic=${diagnostic//$'\n'/%0A}
          echo "::error title=Production deploy failure::${diagnostic:-Remote deploy did not return a success marker.}"
          exit 1
