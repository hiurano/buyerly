name: CI/CD & Auto-Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buyerly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm run build` runs tsc first, so a type error fails here rather than
      # reaching production. No test reads frontend/dist, so this runs beside
      # the test shards instead of inside each one.
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          node scripts/check-campaign-filters.cjs
          node scripts/check-scoped-state.cjs
          node scripts/check-hierarchy-parents.cjs
          node scripts/check-snooze-query.cjs
          node scripts/check-sessions.cjs
          node scripts/check-rule-precedence.cjs
          node scripts/check-details-pane.cjs
          node scripts/check-app-version.cjs
          node scripts/check-list-view.cjs
          node scripts/check-accounts.cjs
          npm run build

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  # The browser checks used to run one after another inside the frontend job
  # (~7.5 minutes, and the test shards waited for all of them). Each group is
  # now its own runner, started at once beside the build and the test shards;
  # the groups are balanced by how long their scripts took on 2026-10-10.
  # Each script still serves the app itself through Vite on 127.0.0.1:5174,
  # so none of them needs the built frontend.
  browser:
    name: Browser checks (${{ matrix.group }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: small screens and Inbox
            scripts: mobile-screens inbox
          - group: sidebar, command menu, rules
            scripts: mobile-sidebar command-menu rule-states rules-phone
          - group: workspace state, new version, WebMCP
            scripts: scoped-state new-version webmcp view-options accounts
          - group: members, search, settings
            scripts: members search-page workspace-switcher security profile
          - group: auth, details pane, Ads Manager rules
            scripts: details-pane invite-auth auth-theme workspace-settings multi-account rules-attach

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Playwright is a pinned devDependency in frontend/package-lock.json, so
      # `npm ci` installs it. Installing it ad hoc without the lock file
      # re-resolved the whole tree and once hit a package version npm listed
      # but did not serve yet (#245).
      - name: Install Chromium
        working-directory: frontend
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      # Every script in the group runs even after one fails, so a single run
      # reports all broken screens. The runner's Google Chrome has WebMCP
      # behind a flag; Playwright's Chromium does not, and webmcp-browser.mjs
      # then uses a stand-in instead.
      - name: Check in Chromium
        working-directory: frontend
        run: |
          status=0
          for name in ${{ matrix.scripts }}; do
            echo "::group::${name}-browser.mjs"
            if [ "${name}" = webmcp ]; then
              export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || true)"
            else
              unset PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
            fi
            if ! node "../scripts/${name}-browser.mjs"; then
              echo "::error title=Browser check failed::scripts/${name}-browser.mjs"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      # Screenshots land in /tmp/buyerly-<script name>.
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ strategy.job-index }}
          path: /tmp/buyerly-*
          if-no-files-found: ignore

  test:
    name: Run Unit & Integration Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: frontend

    # The shards run in parallel, each against its own Postgres, so
    # the suite costs its slowest shard rather than its total. Keep the count
    # in sync with --total below; scripts/ci_test_shard.py packs the individual
    # tests, because a single module (test_api) is too heavy to be a unit.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buyerly
          POSTGRES_PASSWORD: buyerly_secret
          POSTGRES_DB: buyerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # test_legal_pages asserts the legal documents reach the Vite build, so
      # the shards need the artifact the frontend job produced.
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://buyerly:buyerly_secret@localhost:5432/buyerly_test
          TEST_DATABASE_URL: postgresql+asyncpg://buyerly:buyerly_secret@localhost:5432/buyerly_test
          TEST_DATABASE_DISPOSABLE: buyerly_test
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
        run: |
          set -o pipefail
          test_ids=$(python scripts/ci_test_shard.py --shard ${{ matrix.shard }} --total 6)
          if [ -z "${test_ids}" ]; then
            echo "::error title=Empty test shard::Shard ${{ matrix.shard }} resolved to no tests"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/6: $(echo ${test_ids} | wc -w) tests"
          python -m unittest ${test_ids} -v 2>&1 | tee /tmp/buyerly-test-output.log || {
            failure_excerpt=$(grep -E -B 12 -A 35 '^(FAIL|ERROR):|Traceback|AssertionError|^FAILED|^Ran [0-9]+' /tmp/buyerly-test-output.log | tail -n 180 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Unit test failure (shard ${{ matrix.shard }})::${failure_excerpt}"
            exit 1
          }

  # One check to require in branch protection. Requiring the shards directly
  # would mean editing the protection rule every time their number changes.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [frontend, browser, test]
    if: always()

    steps:
      - name: Verify every job succeeded
        run: |
          frontend='${{ needs.frontend.result }}'
          browser='${{ needs.browser.result }}'
          tests='${{ needs.test.result }}'
          echo "frontend=${frontend} browser=${browser} tests=${tests}"
          if [ "${frontend}" != "success" ] || [ "${browser}" != "success" ] || [ "${tests}" != "success" ]; then
            echo "::error title=CI failed::frontend=${frontend} browser=${browser} tests=${tests}"
            exit 1
          fi

  deploy:
    name: Deploy to Production VPS
    needs: [frontend, browser, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Execute Remote SSH Commands for Deployment
        id: production_ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || '' }}
          password: ${{ secrets.VPS_PASSWORD || '' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          capture_stdout: true
          script: |
            set -e
            echo "🚀 [Deploy] Connected to VPS. Starting deployment for Buyerly..."
            if [ -d "/opt/buyerly" ]; then
              cd /opt/buyerly
              echo "📥 Pulling latest git changes..."
              git fetch origin main
              git reset --hard origin/main
              chmod +x scripts/*.sh scripts/*.py || true
              deploy_log="/tmp/buyerly-deploy-${{ github.sha }}.log"
              umask 077
              : >"${deploy_log}"
              if EXPECTED_SHA="${{ github.sha }}" RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" bash scripts/deploy.sh >"${deploy_log}" 2>&1; then
                echo "BUYERLY_DEPLOY_RESULT=success"
                rm -f "${deploy_log}"
              else
                deploy_status=$?
                echo "BUYERLY_DEPLOY_RESULT=failure"
                echo "BUYERLY_DEPLOY_EXIT=${deploy_status}"
                grep -E '^(\[[0-9]+/[0-9]+\]|\[(ERROR|ROLLBACK|WARNING)\]|ERROR:|DETAIL:)' "${deploy_log}" \
                  | tail -n 20 \
                  | sed -E 's/(re_)[A-Za-z0-9_]{6,}/\1[REDACTED]/g' \
                  || true
                grep -E '(MetaTokenError|RuntimeError|alembic\.util\.exc\.|sqlalchemy\.exc\.|ProgrammingError|OperationalError|IntegrityError|InvalidToken|ValueError|KeyError|FAILED:)' "${deploy_log}" \
                  | grep -Ev '(parameters:|UPDATE accounts|INSERT INTO)' \
                  | tail -n 12 \
                  | sed -E \
                    -e 's/gAAAAA[A-Za-z0-9_-]+/[REDACTED_FERNET_TOKEN]/g' \
                    -e 's/EAA[A-Za-z0-9_-]{10,}/[REDACTED_META_TOKEN]/g' \
                    -e 's#(://)[^:/[:space:]]+:[^@/[:space:]]+@#\1[REDACTED]@#g' \
                    -e 's/(password=)[^&[:space:]]+/\1[REDACTED]/Ig' \
                  || true
                grep -E '(File "/app/|alembic\.runtime\.migration.*Running (upgrade|stamp))' "${deploy_log}" \
                  | grep -Ev '(parameters:|UPDATE accounts|INSERT INTO)' \
                  | tail -n 24 \
                  || true
              fi
            else
              echo "❌ Error: /opt/buyerly directory does not exist on server!"
              echo "BUYERLY_DEPLOY_RESULT=failure"
              echo "[ERROR] Production application directory is missing."
            fi
            exit 0

      - name: Assert Remote Deployment Result
        env:
          DEPLOY_OUTPUT: ${{ steps.production_ssh.outputs.stdout }}
        run: |
          if printf '%s\n' "${DEPLOY_OUTPUT}" | grep -q '^BUYERLY_DEPLOY_RESULT=success$'; then
            exit 0
          fi
          diagnostic=$(printf '%s\n' "${DEPLOY_OUTPUT}" \
            | grep -E '(^(BUYERLY_DEPLOY_EXIT=|\[[0-9]+/[0-9]+\]|\[(ERROR|ROLLBACK|WARNING)\]|ERROR:|DETAIL:)|File "/app/|Running (upgrade|stamp)|MetaTokenError|RuntimeError|alembic\.util\.exc\.|sqlalchemy\.exc\.|ProgrammingError|OperationalError|IntegrityError|InvalidToken|ValueError|KeyError|FAILED:)' \
            | tail -n 56 \
            | tr '\n' ' ')
          diagnostic=${diagnostic//%/%25}
          diagnostic=${diagnostic//$'\r'/%0D}
          diagnostic=${diagnostic//$'\n'/%0A}
          echo "::error title=Production deploy failure::${diagnostic:-Remote deploy did not return a success marker.}"
          exit 1
