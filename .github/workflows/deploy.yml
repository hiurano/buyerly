name: CI/CD & Auto-Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buyerly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm run build` runs tsc first, so a type error fails here rather than
      # reaching production. No test reads frontend/dist, so this runs beside
      # the test shards instead of inside each one.
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          node scripts/check-campaign-filters.cjs
          node scripts/check-scoped-state.cjs
          node scripts/check-hierarchy-parents.cjs
          node scripts/check-snooze-query.cjs
          node scripts/check-sessions.cjs
          node scripts/check-rule-precedence.cjs
          node scripts/check-app-version.cjs
          npm run build

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

      # Playwright is a pinned devDependency in frontend/package-lock.json, so
      # `npm ci` above already installed it. Installing it ad hoc without the
      # lock file re-resolved the whole tree and once hit a package version
      # npm listed but did not serve yet (#245).
      - name: Check workspace state in Chromium
        working-directory: frontend
        run: |
          npx --no-install playwright install --with-deps chromium
          node ../scripts/scoped-state-browser.mjs

      - name: Upload scoped state browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-state-browser
          path: /tmp/buyerly-scoped-state

      - name: Check invitation authentication in Chromium
        working-directory: frontend
        run: node ../scripts/invite-auth-browser.mjs

      - name: Upload invitation authentication browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invite-auth-browser
          path: /tmp/buyerly-invite-auth

      - name: Check members and log out in Chromium
        working-directory: frontend
        run: node ../scripts/members-browser.mjs

      - name: Upload members browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: members-browser
          path: /tmp/buyerly-members

      - name: Check Security & access sessions in Chromium
        working-directory: frontend
        run: node ../scripts/security-browser.mjs

      - name: Upload Security & access browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-browser
          path: /tmp/buyerly-security

      - name: Check workspace switching in Chromium
        working-directory: frontend
        run: node ../scripts/workspace-switcher-browser.mjs

      - name: Upload workspace switcher browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-switcher-browser
          path: /tmp/buyerly-workspace-switcher

      - name: Check several logged-in accounts in Chromium
        working-directory: frontend
        run: node ../scripts/multi-account-browser.mjs

      - name: Upload multi-account browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-account-browser
          path: /tmp/buyerly-multi-account

      - name: Check Inbox in Chromium
        working-directory: frontend
        run: node ../scripts/inbox-browser.mjs

      - name: Upload Inbox browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbox-browser
          path: /tmp/buyerly-inbox

      - name: Check the small-screen sidebar in Chromium
        working-directory: frontend
        run: node ../scripts/mobile-sidebar-browser.mjs

      - name: Upload small-screen sidebar browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-sidebar-browser
          path: /tmp/buyerly-mobile-sidebar

      - name: Check light and dark themes outside the app in Chromium
        working-directory: frontend
        run: node ../scripts/auth-theme-browser.mjs

      - name: Upload light and dark theme browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-theme-browser
          path: /tmp/buyerly-auth-theme

      - name: Check the command menu in Chromium
        working-directory: frontend
        run: node ../scripts/command-menu-browser.mjs

      - name: Upload command menu browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-menu-browser
          path: /tmp/buyerly-command-menu

      - name: Check the search page in Chromium
        working-directory: frontend
        run: node ../scripts/search-page-browser.mjs

      - name: Upload search page browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-page-browser
          path: /tmp/buyerly-search-page

      - name: Check rule states in Chromium
        working-directory: frontend
        run: node ../scripts/rule-states-browser.mjs

      - name: Upload rule states browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-states-browser
          path: /tmp/buyerly-rule-states

      - name: Check rules in Ads Manager in Chromium
        working-directory: frontend
        run: node ../scripts/rules-attach-browser.mjs

      - name: Upload rules in Ads Manager browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-attach-browser
          path: /tmp/buyerly-rules-attach

      - name: Check rules on a phone in Chromium
        working-directory: frontend
        run: node ../scripts/rules-phone-browser.mjs

      - name: Upload rules on a phone browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-phone-browser
          path: /tmp/buyerly-rules-phone

      - name: Check the new version notice in Chromium
        working-directory: frontend
        run: node ../scripts/new-version-browser.mjs

      - name: Upload new version notice browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-version-browser
          path: /tmp/buyerly-new-version

      - name: Check Rules, Ads Manager and Inbox on small screens in Chromium
        working-directory: frontend
        run: node ../scripts/mobile-screens-browser.mjs

      - name: Upload small-screen screens browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screens-browser
          path: /tmp/buyerly-mobile-screens

      # The runner's Google Chrome has WebMCP behind a flag; Playwright's
      # Chromium does not, and the check then uses a stand-in instead.
      - name: Check WebMCP tools in Chromium
        working-directory: frontend
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || true)"
          node ../scripts/webmcp-browser.mjs

      - name: Upload WebMCP browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-browser
          path: /tmp/buyerly-webmcp

  test:
    name: Run Unit & Integration Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: frontend

    # The shards run in parallel, each against its own Postgres and Redis, so
    # the suite costs its slowest shard rather than its total. Keep the count
    # in sync with --total below; scripts/ci_test_shard.py packs the individual
    # tests, because a single module (test_api) is too heavy to be a unit.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buyerly
          POSTGRES_PASSWORD: buyerly_secret
          POSTGRES_DB: buyerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # test_legal_pages asserts the legal documents reach the Vite build, so
      # the shards need the artifact the frontend job produced.
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://buyerly:buyerly_secret@localhost:5432/buyerly_test
          TEST_DATABASE_URL: postgresql+asyncpg://buyerly:buyerly_secret@localhost:5432/buyerly_test
          TEST_DATABASE_DISPOSABLE: buyerly_test
          REDIS_URL: redis://localhost:6379/15
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
        run: |
          set -o pipefail
          test_ids=$(python scripts/ci_test_shard.py --shard ${{ matrix.shard }} --total 6)
          if [ -z "${test_ids}" ]; then
            echo "::error title=Empty test shard::Shard ${{ matrix.shard }} resolved to no tests"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/6: $(echo ${test_ids} | wc -w) tests"
          python -m unittest ${test_ids} -v 2>&1 | tee /tmp/buyerly-test-output.log || {
            failure_excerpt=$(grep -E -B 12 -A 35 '^(FAIL|ERROR):|Traceback|AssertionError|^FAILED|^Ran [0-9]+' /tmp/buyerly-test-output.log | tail -n 180 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Unit test failure (shard ${{ matrix.shard }})::${failure_excerpt}"
            exit 1
          }

  # One check to require in branch protection. Requiring the shards directly
  # would mean editing the protection rule every time their number changes.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [frontend, test]
    if: always()

    steps:
      - name: Verify every job succeeded
        run: |
          frontend='${{ needs.frontend.result }}'
          tests='${{ needs.test.result }}'
          echo "frontend=${frontend} tests=${tests}"
          if [ "${frontend}" != "success" ] || [ "${tests}" != "success" ]; then
            echo "::error title=CI failed::frontend=${frontend} tests=${tests}"
            exit 1
          fi

  deploy:
    name: Deploy to Production VPS
    needs: [frontend, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Execute Remote SSH Commands for Deployment
        id: production_ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || '' }}
          password: ${{ secrets.VPS_PASSWORD || '' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          capture_stdout: true
          script: |
            set -e
            echo "🚀 [Deploy] Connected to VPS. Starting deployment for Buyerly..."
            if [ -d "/opt/buyerly" ]; then
              cd /opt/buyerly
              echo "📥 Pulling latest git changes..."
              git fetch origin main
              git reset --hard origin/main
              chmod +x scripts/*.sh scripts/*.py || true
              deploy_log="/tmp/buyerly-deploy-${{ github.sha }}.log"
              umask 077
              : >"${deploy_log}"
              if EXPECTED_SHA="${{ github.sha }}" RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" bash scripts/deploy.sh >"${deploy_log}" 2>&1; then
                echo "BUYERLY_DEPLOY_RESULT=success"
                rm -f "${deploy_log}"
              else
                deploy_status=$?
                echo "BUYERLY_DEPLOY_RESULT=failure"
                echo "BUYERLY_DEPLOY_EXIT=${deploy_status}"
                grep -E '^(\[[0-9]+/[0-9]+\]|\[(ERROR|ROLLBACK|WARNING)\]|ERROR:|DETAIL:)' "${deploy_log}" \
                  | tail -n 20 \
                  | sed -E 's/(re_)[A-Za-z0-9_]{6,}/\1[REDACTED]/g' \
                  || true
                grep -E '(MetaTokenError|RuntimeError|alembic\.util\.exc\.|sqlalchemy\.exc\.|ProgrammingError|OperationalError|IntegrityError|InvalidToken|ValueError|KeyError|FAILED:)' "${deploy_log}" \
                  | grep -Ev '(parameters:|UPDATE accounts|INSERT INTO)' \
                  | tail -n 12 \
                  | sed -E \
                    -e 's/gAAAAA[A-Za-z0-9_-]+/[REDACTED_FERNET_TOKEN]/g' \
                    -e 's/EAA[A-Za-z0-9_-]{10,}/[REDACTED_META_TOKEN]/g' \
                    -e 's#(://)[^:/[:space:]]+:[^@/[:space:]]+@#\1[REDACTED]@#g' \
                    -e 's/(password=)[^&[:space:]]+/\1[REDACTED]/Ig' \
                  || true
                grep -E '(File "/app/|alembic\.runtime\.migration.*Running (upgrade|stamp))' "${deploy_log}" \
                  | grep -Ev '(parameters:|UPDATE accounts|INSERT INTO)' \
                  | tail -n 24 \
                  || true
              fi
            else
              echo "❌ Error: /opt/buyerly directory does not exist on server!"
              echo "BUYERLY_DEPLOY_RESULT=failure"
              echo "[ERROR] Production application directory is missing."
            fi
            exit 0

      - name: Assert Remote Deployment Result
        env:
          DEPLOY_OUTPUT: ${{ steps.production_ssh.outputs.stdout }}
        run: |
          if printf '%s\n' "${DEPLOY_OUTPUT}" | grep -q '^BUYERLY_DEPLOY_RESULT=success$'; then
            exit 0
          fi
          diagnostic=$(printf '%s\n' "${DEPLOY_OUTPUT}" \
            | grep -E '(^(BUYERLY_DEPLOY_EXIT=|\[[0-9]+/[0-9]+\]|\[(ERROR|ROLLBACK|WARNING)\]|ERROR:|DETAIL:)|File "/app/|Running (upgrade|stamp)|MetaTokenError|RuntimeError|alembic\.util\.exc\.|sqlalchemy\.exc\.|ProgrammingError|OperationalError|IntegrityError|InvalidToken|ValueError|KeyError|FAILED:)' \
            | tail -n 56 \
            | tr '\n' ' ')
          diagnostic=${diagnostic//%/%25}
          diagnostic=${diagnostic//$'\r'/%0D}
          diagnostic=${diagnostic//$'\n'/%0A}
          echo "::error title=Production deploy failure::${diagnostic:-Remote deploy did not return a success marker.}"
          exit 1
