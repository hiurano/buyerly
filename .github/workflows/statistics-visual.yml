name: Statistics visual check

on:
  pull_request:
    paths:
      - 'frontend/src/components/statistics/**'
      - 'frontend/src/styles/tokens.css'
      - 'scripts/statistics-visual.mjs'
      - '.github/workflows/statistics-visual.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser tools (CI only)
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check Statistics layout and controls
        run: node scripts/statistics-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-visual
          path: /tmp/buyerly-statistics-visual
