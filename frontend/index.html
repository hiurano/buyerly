<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>/* Theme before first paint (#232): the choice from Settings → Preferences, otherwise the system. */(function(){var d=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)');function a(){var t;try{t=localStorage.getItem('buyerly-interface-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=m.matches?'dark':'light';d.setAttribute('data-theme',t);d.style.colorScheme=t;d.classList.toggle('dark',t==='dark')}a();m.addEventListener('change',a)})()</script>
    <!-- Reload splash like Linear's (#433): the app frame in the theme's colors before any JS or CSS,
         the mark with a pulsing ring only after 1s, "Loading…" after 8s. src/lib/splash.ts removes it. -->
    <script>/* Signed-out pages get a plain backdrop instead of the app frame, like Linear's html.logged-out. */(function(){var d=document.documentElement,p=location.pathname,o=/^\/(login|signup|auth|invite|connect|create-workspace)(\/|$)|^\/[^/]+\/welcome\/?$/.test(p);try{o=o||!localStorage.getItem('buyerly-last-account')}catch(e){o=true}o&&d.classList.add('logged-out');var m=document.createElement('meta');m.name='theme-color';m.content=d.getAttribute('data-theme')==='dark'?'#09090A':'#EEEEF0';document.head.appendChild(m)})()</script>
    <style>
      html{--splash-sidebar:lch(94.44% 0.5 282);--splash-canvas:lch(97.94% 0.5 282);--splash-border:lch(89.84% 0 282);--splash-shadow:0 3px 6px -2px rgb(0 0 0/.02),0 1px 1px rgb(0 0 0/.04);--splash-signed-out:rgb(248 248 249);--splash-content:#b0b5c0;background-color:var(--splash-sidebar)}
      html[data-theme=dark]{--splash-sidebar:lch(2.595% 0.4 272);--splash-canvas:lch(5.52% 0.4 272);--splash-border:lch(13.08% 1.48 272);--splash-shadow:0 .5px 1px 1px lch(0% 0 0/.3);--splash-signed-out:rgb(9 9 10);--splash-content:#6b6f76}
      html.logged-out{background-color:var(--splash-signed-out)}
      body{margin:0}
      @keyframes splashPulse{0%{opacity:0;transform:scale(.8)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
      @keyframes splashFadeIn{0%{opacity:0}100%{opacity:1}}
      #loading{position:fixed;inset:0;z-index:99999;display:flex;overflow:hidden;pointer-events:none;background-color:var(--splash-sidebar);color:var(--splash-content);font:500 13px/1.5 "Inter Variable",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:opacity .1s}
      #loading.loaded{opacity:0}
      #appBorders{flex-grow:1;display:flex;margin:8px 8px 36px 244px;border:.5px solid var(--splash-border);border-radius:12px;background-color:var(--splash-canvas);box-shadow:var(--splash-shadow)}
      html.logged-out #loading,html.logged-out #appBorders{background-color:var(--splash-signed-out)}
      html.logged-out #appBorders{margin:0;border:0;border-radius:0;box-shadow:none}
      #loading-content{position:absolute;top:50%;left:calc(50% - 220px);width:440px;height:64px;margin:-46px 0 0 122px;display:flex;flex-direction:column;align-items:center;animation:splashFadeIn .4s ease-out 1s both}
      html.logged-out #loading-content{margin:-32px 0 0}
      #preloaderContent{position:relative;width:64px;height:64px;display:grid;place-items:center}
      #preloaderContent svg{grid-area:1/1}
      #loading .bkg{opacity:0}
      #loading .bkg circle{fill:none;stroke:currentColor;stroke-opacity:.4;stroke-width:8}
      #loading.content-loaded .bkg{animation:splashPulse 3.2s ease-out 1.2s infinite forwards}
      #loading.loaded .bkg{animation-play-state:paused}
      #loadingText{position:relative;top:8px;margin-bottom:-8px;opacity:0;transition:opacity .8s .8s ease-out}
      #loading.loading-text #loadingText{opacity:1}
      @media (max-width:880px){#appBorders{margin:0;border:0;border-radius:0;box-shadow:none}#loading-content{margin-left:0}}
      @media (prefers-reduced-motion:reduce){#loading.content-loaded .bkg{animation:none}}
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- WebMCP origin trial for https://buyerly.app, Chrome 149–156, expires 2026-11-17. Other origins ignore it. -->
    <meta http-equiv="origin-trial" content="Ap4N6kY/2NJ00+lUaT5dBICS83z+r3EF1r6tF1HjeiQ8jv2a7mdPwj2X5NdofM4+i8sL3/ZqDVsIxkzAzZa50AIAAABLeyJvcmlnaW4iOiJodHRwczovL2J1eWVybHkuYXBwOjQ0MyIsImZlYXR1cmUiOiJXZWJNQ1AiLCJleHBpcnkiOjE3OTQ4NzM2MDB9" />
    <title>Buyerly</title>
    <!-- Preload exact Linear Inter Variable Font -->
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <div id="loading" aria-hidden="true">
      <div id="appBorders">
        <div id="loading-content">
          <div id="preloaderContent">
            <svg class="bkg" width="64" height="64" viewBox="0 0 512 512" fill="none"><circle cx="256" cy="256" r="244" /></svg>
            <svg width="32" height="32" viewBox="0 0 512 512" fill="none"><path fill="currentColor" fill-rule="evenodd" d="M192 464V336H112L80 224H192V192H288V48H320L432 464H192Z M288 224L224 256H288V224Z M192 176V48H224L256 176H192Z" /></svg>
          </div>
          <div id="loadingText">Loading…</div>
        </div>
      </div>
    </div>
    <script>window.addEventListener('DOMContentLoaded',function(){var l=document.getElementById('loading');l&&!l.classList.contains('loaded')&&(l.classList.add('content-loaded'),setTimeout(function(){l.classList.add('loading-text')},8e3))})</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
