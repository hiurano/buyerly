type Mutation {
  """
  Logs this account out of this browser; the browser's other accounts stay.
  """
  logout: SuccessPayload

  """Ends one of the user's sessions."""
  logoutSession(sessionId: String!): SuccessPayload

  """Ends every session of the user; with keepCurrent, all but this one."""
  logoutAllSessions(keepCurrent: Boolean! = false): SuccessPayload

  """Mails a code that attaches or changes the email of the user."""
  userEmailChangeRequest(input: JSON!): EmailChangePayload

  """Confirms the code and makes the new email the user's own."""
  userEmailChangeVerify(input: JSON!): EmailChangePayload

  """A signed link to PUT a file to: an avatar or a workspace logo."""
  fileUpload(input: JSON!): UploadPayload

  """
  Mails a sign-in code and link; a new address without an invite passes Turnstile first.
  """
  emailUserAccountAuthChallenge(input: JSON!): JSON!

  """Signs in with the emailed code, creating the account on first sign-in."""
  emailTokenUserAccountAuth(input: JSON!): JSON!

  """Signs in with the emailed one-time link."""
  emailLinkUserAccountAuth(input: JSON!): JSON!

  """
  Opens a time-limited support session in a workspace for a platform administrator.
  """
  supportSessionCreate(input: JSON!): SupportSessionPayload

  """Ends a support session early."""
  supportSessionRevoke(id: Int!): SuccessPayload

  """Renames an ad account or changes its note."""
  accountUpdate(accountId: String!, input: JSON!): AccountPayload

  """Sets or clears an ad account's lead."""
  accountLeadUpdate(accountId: String!, input: JSON!): AccountPayload

  """Removes an ad account from the workspace."""
  accountDelete(accountId: String!): AccountPayload

  """Sets the member's notifications for one ad account."""
  accountNotificationSettingUpdate(accountId: String!, input: JSON!): AccountNotificationSettingPayload

  """Attaches a rule to an ad account."""
  accountRuleAttach(accountId: String!, input: JSON!): AccountPayload

  """Detaches a rule from an ad account."""
  accountRuleDetach(accountId: String!, ruleId: Int!): AccountPayload

  """Narrows an attached rule to some campaigns, ad sets or ads."""
  accountRuleScopeUpdate(accountId: String!, ruleId: Int!, input: JSON!): AccountPayload

  """Turns an ad account's rules on or off."""
  accountRulesToggle(accountId: String!): AccountPayload

  """Turns a stopped ad set back on in Meta."""
  adSetReactivate(adSetId: String!): DeliveryPayload

  """Dismisses a stopped ad set from the list."""
  adSetDismiss(adSetId: String!): DeliveryPayload

  """Turns a campaign, ad set or ad on or off in Meta."""
  entityDeliveryUpdate(level: String!, entityId: String!, input: JSON!): DeliveryPayload

  """Changes a campaign's or ad set's budget in Meta."""
  entityBudgetUpdate(level: String!, entityId: String!, input: JSON!): DeliveryPayload

  """Undoes what an audit event did."""
  auditEventUndo(id: Int!): AuditEventPayload

  """Restores a rule or label from Recently deleted."""
  deletedItemRestore(id: Int!): DeletedItemPayload

  """
  Stars a page or record; starring it again returns the favorite it already is.
  """
  favoriteCreate(input: JSON!): FavoritePayload

  """Unstars a favorite; succeeds when it was already gone."""
  favoriteDelete(id: Int!): SuccessPayload

  """Saves the member's options for a view."""
  viewSettingUpdate(key: String!, input: JSON!): ViewSettingPayload

  """Resets the member's options for a view to the workspace's default."""
  viewSettingReset(key: String!): SuccessPayload

  """Saves a view's options as the workspace's default."""
  workspaceViewDefaultUpdate(key: String!, input: JSON!): ViewSettingPayload

  """Saves the member's Inbox display options."""
  inboxDisplayUpdate(input: JSON!): InboxDisplayPayload

  """Marks an Inbox notification read or unread."""
  inboxNotificationRead(id: Int!, input: JSON!): InboxNotificationPayload

  """Deletes an Inbox notification for the member."""
  inboxNotificationDelete(id: Int!): InboxNotificationPayload

  """Snoozes an Inbox notification, or wakes it."""
  inboxNotificationSnooze(id: Int!, input: JSON!): InboxNotificationPayload

  """Deletes every Inbox notification of the member."""
  inboxDeleteAll: InboxNotificationPayload

  """Deletes the member's read Inbox notifications."""
  inboxDeleteAllRead: InboxNotificationPayload

  """Sets where the member's notifications go besides the Inbox."""
  notificationChannelsUpdate(input: JSON!): NotificationChannelsPayload

  """This browser gets the member's desktop notifications."""
  desktopNotificationsSubscribe(input: JSON!): DesktopNotificationsPayload

  """This browser stops getting the member's desktop notifications."""
  desktopNotificationsUnsubscribe(input: JSON!): DesktopNotificationsPayload

  """
  Creates a one-time link for someone else to connect their Facebook profile.
  """
  metaInviteCreate(input: JSON!): MetaInvitePayload

  """Reads a Meta connection's ad accounts from Meta again."""
  metaConnectionDiscover(connectionId: Int!): MetaConnectionPayload

  """Adds ad accounts of a Meta connection to the workspace."""
  metaConnectionImport(connectionId: Int!, input: JSON!): MetaConnectionPayload

  """Starts Facebook login; returns the address to send the browser to."""
  metaOauthStart(returnPath: String = null, reconnectConnectionId: Int = null): MetaOAuthPayload

  """Saves the new user's name."""
  onboardingPersonalDetailsUpdate(input: JSON!): OnboardingPayload

  """Creates the new user's first workspace."""
  onboardingWorkspaceCreate(input: JSON!): OnboardingPayload

  """Invites teammates during onboarding."""
  onboardingInvitesSend(input: JSON!): OnboardingPayload

  """Skips the rest of onboarding."""
  onboardingSkip: OnboardingPayload

  """Creates a rule."""
  ruleCreate(input: JSON!): RulePayload

  """Changes a rule."""
  ruleUpdate(id: Int!, input: JSON!): RulePayload

  """Moves a rule to Recently deleted."""
  ruleDelete(id: Int!): RulePayload

  """Sets a rule's labels."""
  ruleLabelsSet(id: Int!, input: JSON!): RulePayload

  """Adds or removes labels on several rules at once."""
  rulesLabelsChange(input: JSON!): RulesPayload

  """Creates a rule label."""
  ruleLabelCreate(input: JSON!): RuleLabelPayload

  """Changes a rule label."""
  ruleLabelUpdate(id: Int!, input: JSON!): RuleLabelPayload

  """Moves a rule label to Recently deleted."""
  ruleLabelDelete(id: Int!): RuleLabelPayload

  """Creates a team."""
  teamCreate(workspaceId: Int!, input: JSON!): TeamPayload

  """Changes a team."""
  teamUpdate(workspaceId: Int!, id: Int!, input: JSON!): TeamPayload

  """Retires a team."""
  teamRetire(workspaceId: Int!, id: Int!): TeamPayload

  """Brings a retired team back."""
  teamRestore(workspaceId: Int!, id: Int!): TeamPayload

  """Deletes a team."""
  teamDelete(workspaceId: Int!, id: Int!): TeamPayload

  """Adds workspace members to a team."""
  teamMembersAdd(workspaceId: Int!, teamId: Int!, input: JSON!): TeamPayload

  """Takes a member off a team."""
  teamMemberRemove(workspaceId: Int!, teamId: Int!, userId: Int!): TeamPayload

  """Makes a team member a team owner, or not."""
  teamMemberUpdate(workspaceId: Int!, teamId: Int!, userId: Int!, input: JSON!): TeamPayload

  """Puts ad accounts on a team."""
  teamAccountsAdd(workspaceId: Int!, teamId: Int!, input: JSON!): TeamPayload

  """Takes an ad account off a team."""
  teamAccountRemove(workspaceId: Int!, teamId: Int!, accountId: Int!): TeamPayload

  """Creates a team document."""
  teamDocumentCreate(workspaceId: Int!, teamId: Int!, input: JSON!): TeamDocumentPayload

  """Changes a team document."""
  teamDocumentUpdate(workspaceId: Int!, teamId: Int!, id: Int!, input: JSON!): TeamDocumentPayload

  """Deletes a team document."""
  teamDocumentDelete(workspaceId: Int!, teamId: Int!, id: Int!): TeamDocumentPayload

  """Creates the link that connects the member's Telegram."""
  telegramLinkCreate: TelegramPayload

  """Disconnects the member's Telegram."""
  telegramDisconnect: TelegramPayload

  """Changes the user's name or username."""
  userUpdate(input: JSON!): UserPayload

  """Creates a workspace."""
  workspaceCreate(input: JSON!): WorkspacePayload

  """Changes a workspace's name, address or logo."""
  workspaceUpdate(id: Int!, input: JSON!): WorkspacePayload

  """Deletes a workspace."""
  workspaceDelete(id: Int!): WorkspacePayload

  """Makes a workspace the user's active one."""
  workspaceSwitch(input: JSON!): WorkspacePayload

  """Leaves a workspace."""
  workspaceLeave(id: Int!): WorkspacePayload

  """Hands a workspace to another member."""
  workspaceOwnershipTransfer(id: Int!, input: JSON!): WorkspacePayload

  """Changes a member's role."""
  workspaceMemberUpdate(workspaceId: Int!, userId: Int!, input: JSON!): WorkspaceMemberPayload

  """Removes a member from the workspace."""
  workspaceMemberRemove(workspaceId: Int!, userId: Int!): WorkspaceMemberPayload

  """Invites people to the workspace by email."""
  workspaceInviteCreate(workspaceId: Int!, input: JSON!): WorkspaceInvitePayload

  """Revokes a pending invite."""
  workspaceInviteDelete(workspaceId: Int!, id: Int!): WorkspaceInvitePayload

  """Sends a pending invite again."""
  workspaceInviteResend(workspaceId: Int!, id: Int!): WorkspaceInvitePayload

  """Joins a workspace through an invite."""
  workspaceInviteAccept(token: String!): WorkspaceInvitePayload

  """Turns the workspace's invite link on."""
  workspaceInviteLinkEnable(workspaceId: Int!): WorkspaceInviteLinkPayload

  """Replaces the workspace's invite link; the old one stops working."""
  workspaceInviteLinkReset(workspaceId: Int!): WorkspaceInviteLinkPayload

  """Turns the workspace's invite link off."""
  workspaceInviteLinkDisable(workspaceId: Int!): WorkspaceInviteLinkPayload
}

