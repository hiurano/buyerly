type Query {
  """
  Every user, workspace, membership and invite, for a platform administrator.
  """
  adminOverview: JSON!

  """The platform administrator's support sessions, newest first."""
  supportSessions(activeOnly: Boolean! = true): JSON!

  """The signed-in user's profile and the workspaces they belong to."""
  viewer: JSON!

  """The user's signed-in browsers, most recently used first."""
  authenticationSessions: JSON!

  """Every account signed in to this browser, in the order they were added."""
  availableUsers: JSON!

  """What an invite link offers, for the page shown before signing in."""
  workspaceInviteDetails(token: String!): JSON!

  """What a Meta connection invite link offers, for the page shown before connecting."""
  metaInviteDetails(token: String!): JSON!

  """Reliability signals and ad account health of the active workspace."""
  healthOverview: JSON!

  """
  Ad accounts of the workspace the member may see, with their latest metrics.
  """
  accounts: JSON!

  """The member's notification settings for one ad account (its bell)."""
  accountNotificationSetting(accountId: String!): JSON!

  """
  Campaigns, ad sets or ads under a Meta entity, with their insights for the period.
  """
  analyticsHierarchy(parentId: String!, level: String = null, period: String = null, compare: String = null): JSON!

  """
  Ad account rows with their insights for the period; every visible one when none named.
  """
  analyticsAccountsHierarchy(accountIds: String = null, period: String = null): JSON!

  """A page of the workspace's audit log, newest first."""
  auditEvents(page: Int = null, pageSize: Int = null, category: String = null, status: String = null, accountId: String = null, ruleId: Int = null, search: String = null, dateFrom: String = null, dateTo: String = null): JSON!

  """Recently deleted rules and labels."""
  deletedItems: JSON!

  """The member's favorites in sidebar order."""
  favorites: JSON!

  """A page of the member's Inbox."""
  inbox(offset: Int = null, limit: Int = null, ordering: String = null, unreadOnly: Boolean = null, showSnoozed: Boolean = null, unreadFirst: Boolean = null, tab: String = null, priority: String = null, filter: String = null): JSON!

  """Counts behind the Inbox filter menu."""
  inboxFacets(unreadOnly: Boolean = null, showSnoozed: Boolean = null, tab: String = null, priority: String = null): JSON!

  """Who sent the member's Inbox notifications."""
  inboxSenders: JSON!

  """The member's Inbox display options."""
  inboxDisplay: JSON!

  """Unread Inbox notifications, for the sidebar's badge."""
  inboxUnreadCount: JSON!

  """Where the member's notifications go besides the Inbox."""
  notificationChannels: JSON!

  """Whether desktop notifications work here and reach this browser."""
  desktopNotifications(endpoint: String = null): JSON!

  """The workspace's Meta connections."""
  metaConnections: JSON!

  """The workspace's rules."""
  rules: JSON!

  """The workspace's rule labels with their rule counts."""
  ruleLabels: JSON!

  """What each rule last decided about one campaign, ad set or ad."""
  ruleStates(entityLevel: String!, entityId: String!): JSON!

  """What one rule last decided about each entity it checks."""
  ruleEntityStates(ruleId: Int!): JSON!

  """What an attached rule would do on an ad account now."""
  rulePreview(accountId: String!, ruleId: Int!): JSON!

  """Whether a rule draft is valid, without saving it."""
  ruleDraftCheck(input: JSON!): JSON!

  """What a rule draft would do on an ad account now."""
  ruleDraftPreview(accountId: String!, input: JSON!): JSON!

  """
  Campaigns, ad sets, ads, rules and ad accounts matching a name or Meta ID.
  """
  search(q: String!, limit: Int = null, kind: String = null, status: [String!] = null, account: [String!] = null, order: String = null, includeDeleted: Boolean = null): JSON!

  """Ad sets rules stopped, to reactivate or dismiss."""
  stoppedAdSets: JSON!

  """The member's Telegram connection."""
  telegramConnection: JSON!

  """The workspace's teams, active or retired."""
  teams(workspaceId: Int!, status: String = null): JSON!

  """A team's documents."""
  teamDocuments(workspaceId: Int!, teamId: Int!): JSON!

  """The member's saved view options and the workspace's defaults."""
  viewSettings: JSON!

  """The workspaces the user belongs to."""
  workspaces: JSON!

  """A workspace's members."""
  workspaceMembers(workspaceId: Int!): JSON!

  """A workspace's pending invites."""
  workspaceInvites(workspaceId: Int!): JSON!

  """A workspace's invite link, when it has one."""
  workspaceInviteLink(workspaceId: Int!): JSON!

  """Whether a workspace address is free."""
  workspaceSlugCheck(slug: String!): JSON!
}

