name: buyerly

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

x-app: &app
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-local}
  image: buyerly-app:${APP_VERSION:-local}
  env_file:
    - .env
  environment: &app-environment
    APP_VERSION: ${APP_VERSION:-local}
    DATABASE_URL: postgresql+asyncpg://buyerly:${POSTGRES_PASSWORD:-buyerly-local-change-me}@db:5432/buyerly
    # Only the tunnel reaches the API, from its fixed address below; it is
    # trusted to report the visitor's address in CF-Connecting-IP.
    CLOUDFLARE_TUNNEL_CIDRS: 172.30.0.10/32
    TRUSTED_PROXY_CIDRS: ""
    WEBAPP_URL: ${WEBAPP_URL:-https://buyerly.app}
    # The TypeScript server (#611); the API forwards it the paths it owns.
    SERVER_URL: http://server:8090
    # BullMQ queues of the TypeScript worker (decision 54, #611 stage 4).
    REDIS_URL: redis://redis:6379/0
    # Background jobs the TypeScript worker owns; the Python worker skips
    # them (core/worker_jobs.py). Moving one back to Python is
    # TS_WORKER_JOBS=<the rest> in .env (an empty value moves all of them)
    # and `docker compose up -d worker worker-ts api`.
    TS_WORKER_JOBS: ${TS_WORKER_JOBS-sync_log_compaction,inbox_email,inbox_telegram,inbox_push}
    TZ: UTC
  volumes:
    - ./logs:/app/logs:z
  restart: unless-stopped
  logging: *default-logging

services:
  db:
    image: postgres:16-alpine
    container_name: buyerly-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: buyerly
      POSTGRES_USER: buyerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buyerly-local-change-me}
      TZ: UTC
    volumes:
      - buyerly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyerly -d buyerly"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Queues and schedules of the TypeScript worker (BullMQ, decision 54).
  # BullMQ needs every key kept (noeviction); the append-only file keeps the
  # schedules across restarts. The host is small: Redis gets a hard cap.
  redis:
    image: redis:7.4.11-alpine
    container_name: buyerly-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 160m
    volumes:
      - buyerly-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-off: `docker compose run --rm migrate` before a release starts.
  migrate:
    <<: *app
    container_name: buyerly-migrate
    command: ["python", "-m", "services.database"]
    restart: "no"
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  # API, React app, public pages and uploads in one process.
  api:
    <<: *app
    container_name: buyerly-api
    command: ["python", "-m", "services.api"]
    ports:
      # Loopback only, for checks on the server; visitors come through the tunnel.
      - "127.0.0.1:8080:8080"
    environment:
      <<: *app-environment
      # The TypeScript server passes client API documents it does not answer
      # yet back to the API (#611), with the visitor's address in
      # X-Forwarded-For; only its fixed address below is trusted for that.
      TRUSTED_PROXY_CIDRS: 172.30.0.20/32
    volumes:
      - ./logs:/app/logs:z
      - buyerly-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  # The TypeScript server (#611), from the same image. It takes over the
  # backend one area at a time; until it fronts the site, the API forwards it
  # the paths it owns (SERVER_PATHS), so it publishes no port of its own.
  server:
    <<: *app
    container_name: buyerly-server
    command: ["node", "server/dist/main.js"]
    environment:
      <<: *app-environment
      # Its only client is the API, which appends the tunnel's address to
      # X-Forwarded-For; trusting the Compose network lets the server read the
      # visitor's address and place as the API does. Nothing else connects to
      # it: it publishes no port and the tunnel routes to the API alone.
      TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      # Client API documents not moved yet go back to the API (#611).
      API_URL: http://api:8080
    # The API's uploads directory (#611): avatars and logos are written and
    # served here now, and both servers read and remove the same files.
    volumes:
      - buyerly-uploads:/app/uploads
    networks:
      default:
        # Fixed, so the API can trust it as a proxy (TRUSTED_PROXY_CIDRS above).
        ipv4_address: 172.30.0.20
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health/server/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  worker:
    <<: *app
    container_name: buyerly-worker
    command: ["python", "-m", "services.worker"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time, sys; from pathlib import Path; p = Path('/tmp/buyerly-worker-heartbeat'); sys.exit(0 if p.is_file() and (time.time() - p.stat().st_mtime) < 45 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 15s

  # The TypeScript worker (#611 stage 4), from the same image: the jobs in
  # TS_WORKER_JOBS on BullMQ (server/src/worker/). It answers its health on
  # 8091 inside the container only. On SIGTERM running jobs finish first.
  worker-ts:
    <<: *app
    container_name: buyerly-worker-ts
    command: ["node", "server/dist/worker/main.js"]
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health/worker-ts').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Nightly backup of the database and uploads, encrypted, to S3
  # (scripts/backup_service.sh). It lives here rather than in the host's cron
  # so a new server gets it from `deploy.sh` alone. deploy.sh starts it by
  # name; the profile keeps a local `docker compose up` from running it.
  backup:
    <<: *app
    container_name: buyerly-backup
    command: ["bash", "scripts/backup_service.sh"]
    profiles: ["backup"]
    environment:
      <<: *app-environment
      BACKUP_DB_ACCESS: network
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:-buyerly-local-change-me}
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      BACKUP_STATUS_FILE: /backups/.last-success
    volumes:
      # The host's backups directory: deploy.sh's own dumps land there too.
      - ./backups:/backups
      - buyerly-uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    # Healthy while the last complete run, off-site copies included, is
    # under 26 hours old.
    healthcheck:
      test: ["CMD", "bash", "-c", "f=/backups/.last-success; [[ -f $$f ]] && (( $$(date +%s) - $$(stat -c %Y $$f) < 93600 ))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10m

  # Cloudflare Tunnel: the only way in from the internet. It connects out to
  # Cloudflare, so the server publishes no web ports. Routes live in the
  # tunnel's settings at Cloudflare (buyerly.app -> http://api:8080). The
  # server enables it with COMPOSE_PROFILES=tunnel in .env; local runs skip it.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    container_name: buyerly-tunnel
    command: ["tunnel", "--no-autoupdate", "run"]
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    logging: *default-logging
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: buyerly
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  buyerly-postgres:
    name: buyerly-postgres
  buyerly-uploads:
    name: buyerly-uploads
  buyerly-redis:
    name: buyerly-redis
