name: buyerly

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

x-app: &app
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-local}
  image: buyerly-app:${APP_VERSION:-local}
  env_file:
    - .env
  environment: &app-environment
    APP_VERSION: ${APP_VERSION:-local}
    DATABASE_URL: postgresql+asyncpg://buyerly:${POSTGRES_PASSWORD:-buyerly-local-change-me}@db:5432/buyerly
    # Only the tunnel reaches the API, from its fixed address below; it is
    # trusted to report the visitor's address in CF-Connecting-IP.
    CLOUDFLARE_TUNNEL_CIDRS: 172.30.0.10/32
    TRUSTED_PROXY_CIDRS: ""
    WEBAPP_URL: ${WEBAPP_URL:-https://buyerly.app}
    TZ: UTC
  volumes:
    - ./logs:/app/logs:z
  restart: unless-stopped
  logging: *default-logging

services:
  db:
    image: postgres:16-alpine
    container_name: buyerly-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: buyerly
      POSTGRES_USER: buyerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buyerly-local-change-me}
      TZ: UTC
    volumes:
      - buyerly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyerly -d buyerly"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-off: `docker compose run --rm migrate` before a release starts.
  migrate:
    <<: *app
    container_name: buyerly-migrate
    command: ["python", "-m", "services.database"]
    restart: "no"
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  # API, React app, public pages and uploads in one process.
  api:
    <<: *app
    container_name: buyerly-api
    command: ["python", "-m", "services.api"]
    ports:
      # Loopback only, for checks on the server; visitors come through the tunnel.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs:z
      - buyerly-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    <<: *app
    container_name: buyerly-worker
    command: ["python", "-m", "services.worker"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time, sys; from pathlib import Path; p = Path('/tmp/buyerly-worker-heartbeat'); sys.exit(0 if p.is_file() and (time.time() - p.stat().st_mtime) < 45 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 15s

  # Cloudflare Tunnel: the only way in from the internet. It connects out to
  # Cloudflare, so the server publishes no web ports. Routes live in the
  # tunnel's settings at Cloudflare (buyerly.app -> http://api:8080). The
  # server enables it with COMPOSE_PROFILES=tunnel in .env; local runs skip it.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    container_name: buyerly-tunnel
    command: ["tunnel", "--no-autoupdate", "run"]
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    logging: *default-logging
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: buyerly
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  buyerly-postgres:
    name: buyerly-postgres
  buyerly-uploads:
    name: buyerly-uploads
