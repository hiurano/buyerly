# Local development: the whole app on this computer, with changes visible at
# once. `docker compose -f compose.dev.yaml up`, then open http://localhost:5173
# and sign in with "Continue with email": dev@buyerly.localhost. No email is
# sent: the code and link are in the server's log
# (`docker compose -f compose.dev.yaml logs api`, the line with "[DEV EMAIL]").
# Everything here is local test data; nothing reaches production or Meta:
# Meta is the fake from server/src/scripts/fake-meta.ts, with invented ad accounts.
name: buyerly-dev

x-app-environment: &app-environment
  DATABASE_URL: postgresql://buyerly:buyerly-dev@db:5432/buyerly
  WEBAPP_URL: http://${BUYERLY_WEB_HOST:-localhost}:${BUYERLY_WEB_PORT:-5173}
  SERVER_PORT: "8080"
  SERVE_STATIC: "false"
  SESSION_COOKIE_SECURE: "false"
  DEV_EMAIL_LOG: "true"
  OTP_PEPPER: local-development-only
  META_TOKEN_ENCRYPTION_KEY: CKOJW1eA4PLOe59rNqizKftdfj0lN17_CIFSpe7ihLw=
  META_GRAPH_BASE_URL: http://fake-meta:8090
  REDIS_URL: redis://redis:6379/0
  TZ: UTC
  BUYERLY_DEV_SEED: "1"

x-node: &node
  image: node:24-slim
  working_dir: /repo/server
  volumes:
    - .:/repo
    - buyerly-dev-node-modules:/repo/node_modules

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buyerly
      POSTGRES_USER: buyerly
      POSTGRES_PASSWORD: buyerly-dev
    volumes:
      - buyerly-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyerly -d buyerly"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The worker's queues, as in production (docker-compose.yml).
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 160m
    volumes:
      - buyerly-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # npm workspaces: one install at the repository root for Vite and the
  # server, before either starts.
  deps:
    <<: *node
    working_dir: /repo
    command: ["npm", "ci"]

  # The server; restarts by itself when its code changes. tsc compiles it
  # first: Node's own TypeScript support cannot run TypeORM's decorators.
  # The migrations run before it starts.
  api:
    <<: *node
    command: ["sh", "-c", "npm run build && node dist/migrate.js && npm run dev"]
    environment:
      <<: *app-environment
      # File events do not cross the Windows bind mount; tsc polls instead.
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - .:/repo
      - buyerly-dev-node-modules:/repo/node_modules
      - buyerly-dev-uploads:/repo/uploads
    ports:
      - "127.0.0.1:${BUYERLY_API_PORT:-8080}:8080"
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Syncs the fake Meta's numbers and runs the rules, like production's
  # worker. It runs what `api` compiles and restarts when that changes.
  worker:
    <<: *node
    command: ["node", "--watch", "dist/worker/main.js"]
    # dist/ appears once the server's first compile is done: retry until then.
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  # Invented ad accounts whose numbers grow through the day; rules can pause
  # and rebudget them. Its state (who paused what, when) is in buyerly-dev-meta.
  fake-meta:
    <<: *node
    command: ["node", "--watch", "dist/scripts/fake-meta.js"]
    restart: unless-stopped
    environment:
      FAKE_META_STATE: /data/fake-meta.json
      FAKE_META_PORT: "8090"
    volumes:
      - .:/repo
      - buyerly-dev-node-modules:/repo/node_modules
      - buyerly-dev-meta:/data
    depends_on:
      api:
        condition: service_started

  # The dev user, the Dev workspace and the fake Meta's ad accounts: added
  # once the server has migrated the database (it retries until then).
  seed:
    <<: *node
    command: ["node", "dist/scripts/dev-seed.js"]
    restart: on-failure
    environment: *app-environment
    depends_on:
      api:
        condition: service_started

  # Vite: the page updates in the browser as soon as a frontend file is saved.
  web:
    <<: *node
    working_dir: /repo/frontend
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_ORIGIN: http://api:8080
      VITE_POLL: "1"
    ports:
      - "127.0.0.1:${BUYERLY_WEB_PORT:-5173}:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  buyerly-dev-redis:
  buyerly-dev-postgres:
  buyerly-dev-uploads:
  buyerly-dev-node-modules:
  buyerly-dev-meta:
